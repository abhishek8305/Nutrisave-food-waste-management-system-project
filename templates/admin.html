<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - NutriSave</title>

<style>
body{
    font-family:Arial;
    margin:0;
    padding:0;
    background:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836") no-repeat center center/cover;
    min-height:100vh;
}

/* Dark overlay for readability */
.overlay{
    background:rgba(0,0,0,0.6);
    min-height:100vh;
    padding-bottom:40px;
}

/* Header */
.header{
    background:rgba(27,94,32,0.9);
    color:white;
    padding:20px;
    text-align:center;
    font-size:22px;
}

/* Section */
.section{
    margin:20px auto;
    width:90%;
    max-width:900px;
    padding:20px;
    background:rgba(255,255,255,0.9);
    border-radius:15px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.3);
    backdrop-filter:blur(5px);
}

/* Section header */
.section-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.section-header img{
    width:40px;
    height:40px;
}

/* Title */
h2{
    color:#1b5e20;
    margin:0;
}

/* Item box */
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
    padding:12px;
    background:#f1f1f1;
    border-radius:10px;
}

/* Buttons */
a{
    text-decoration:none;
    padding:6px 12px;
    border-radius:6px;
    color:white;
    font-size:13px;
}

.delete{
    background:#e53935;
}

.accept{
    background:#43a047;
}

.reject{
    background:#fb8c00;
}

a:hover{
    opacity:0.8;
}
</style>

</head>

<body style="background-color:orange;">

<div class="overlay">

<div class="header">
    👨‍💼 Admin Panel - NutriSave System
</div>

<!-- USERS -->
<div class="section">

    <div class="section-header">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
        <h2>Users</h2>
    </div>

    {% for u in users %}
    <div class="item">
        <span>👤 {{ u[1] }}</span>
        <a class="delete" href="/delete_user/{{ u[0] }}">Delete</a>
    </div>
    {% endfor %}

</div>

<!-- FOOD -->
<div class="section">

    <div class="section-header">
        <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">
        <h2>Food Items</h2>
    </div>

    {% for f in food %}
    <div class="item">
        <span>🍲 {{ f[1] }}</span>
        <a class="delete" href="/delete_food/{{ f[0] }}">Delete</a>
    </div>
    {% endfor %}

</div>

<!-- REQUESTS -->
<div class="section">

    <div class="section-header">
        <img src="https://cdn-icons-png.flaticon.com/512/942/942748.png">
        <h2>Requests</h2>
    </div>

    {% for r in requests %}
    <div class="item">
        <span>📦 {{ r[1] }} | Status: {{ r[2] }}</span>

        <div>
            <a class="accept" href="/update_request/{{ r[0] }}/Accepted">Accept</a>
            <a class="reject" href="/update_request/{{ r[0] }}/Rejected">Reject</a>
        </div>
    </div>
    {% endfor %}

</div>

</div>

</body>
</html>
