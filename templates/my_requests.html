<!DOCTYPE html>
<html>
<head>
    <title>My Requests</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 0;
        }

        h2 {
            text-align: center;
            margin-top: 20px;
        }

        table {
            width: 80%;
            margin: 40px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid gray;
            text-align: center;
        }

        th {
            background: green;
            color: white;
        }

        /* Status Colors */
        .accepted {
            color: green;
            font-weight: bold;
        }

        .pending {
            color: orange;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>📦 My Requests</h2>

<table>
    <tr>
        <th>Food Name</th>
        <th>Quantity</th>
        <th>Location</th>
        <th>Status</th>
    </tr>

    {% for req in requests %}
    <tr>
        <td>{{ req[1] }}</td>
        <td>{{ req[2] }}</td>
        <td>{{ req[3] }}</td>

        <td>
            {% if req[4] == "Accepted" %}
                <span class="accepted">{{ req[4] }}</span>
            {% else %}
                <span class="pending">{{ req[4] }}</span>
            {% endif %}
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
