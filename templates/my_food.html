<!DOCTYPE html>
<html>
<head>
    <title>My Food</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f5f5f5;
}

.header{
    background:#1b5e20;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:90%;
    margin:20px auto;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0px 0px 10px #ccc;
}

.delete{
    background:red;
    color:white;
    padding:5px 10px;
    border-radius:5px;
    text-decoration:none;
}

.back{
    display:inline-block;
    margin:10px;
    padding:8px 12px;
    background:#1b5e20;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>

</head>

<body  style="background-color:blue;">

<div class="header">
    <h2>🍲 My Uploaded Food</h2>
</div>


<div class="container">

    {% if foods|length == 0 %}
        <p>No food uploaded yet.</p>
    {% endif %}

    {% for f in foods %}
    <div class="card">
        <p><b>Food:</b> {{ f[1] }}</p>
        <p><b>Quantity:</b> {{ f[2] }} kg</p>
        <p><b>Location:</b> {{ f[3] }}</p>

        <a class="delete" href="/delete_food/{{ f[0] }}">Delete</a>
    </div>
    {% endfor %}

</div>

</body>
</html>
