
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .title{
            text-align:center;
            position:absolute;
            top:20px;
            width:100%
            font-size:28px;
            font-weight:bold;
            color:green;
        }

        .login-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            width: 300px;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>
    <h1 class="title"><u><i>NUTRISAVE FOOD WASTE MANAGEMENT SYSTEM</i></u></h1>

<div class="login-box">
    <h2>Login</h2>

    <form method="POST" action="/login">

        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <!-- NGO or Restaurant select -->
        <select name="role" required>
            <option value="">Select Role</option>
            <option value="ngo">NGO</option>
            <option value="restaurant">res</option>
        </select>

        <button type="submit">Login</button>

    </form>
</div>

</body>
</html>
