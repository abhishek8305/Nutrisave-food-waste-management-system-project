<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NutriSave Login</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Background */
body {
    height: 100vh;
    background: url("https://images.unsplash.com/photo-1504674900247-0877df9cc836") no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* Overlay */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 0;
}

/* Title */
h1, h3 {
    color: white;
    z-index: 1;
}

h1 {
    margin-bottom: 5px;
}

h3 {
    margin-bottom: 20px;
    font-weight: normal;
}

/* Container */
.container {
    position: relative;
    width: 350px;
    z-index: 1;
}

/* Login Card */
.login-box {
    background: rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 15px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
    color: white;
}

/* Logo */
.logo {
    text-align: center;
    margin-bottom: 15px;
}

.logo img {
    width: 80px;
}

/* Heading */
.login-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* Input Box */
.input-box {
    position: relative;
    margin: 15px 0;
}

.input-box input {
    width: 100%;
    padding: 10px 10px 10px 35px;
    border-radius: 8px;
    border: none;
    outline: none;
}

/* Icons */
.input-box i {
    position: absolute;
    left: 10px;
    top: 12px;
    color: #555;
}

/* Select */
select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
}

/* Button */
button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: #00c853;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #009624;
}

/* Signup Link */
.signup-link {
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    color: white;
}

.signup-link a {
    color: #00ff90;
    text-decoration: none;
    font-weight: bold;
}

.signup-link a:hover {
    text-decoration: underline;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 15px;
    font-size: 12px;
    color: #ddd;
}
</style>
</head>

<body>

<h1><b><i>NUTRISAVE</i></b></h1>
<h3><b><i>Food Waste Management System</i></b></h3>

<div class="container">

    <div class="login-box">

        <div class="logo">
            <img src="logo.png" alt="">
        </div>

        <h2>Login</h2>

        <form action="/login" method="post">

            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <select name="role" required>
                <option value="">Select Role</option>
                <option value="admin">Admin</option>
                <option value="restaurant">Restaurant</option>
                <option value="ngo">NGO</option>
            </select>

            <button type="submit">Login</button>

        </form>

        <!-- ✅ SIGNUP LINK (IMPORTANT PART) -->
        <div class="signup-link">
            New user? <a href= "{{url_for('signup')}}">Create Account</a>
        </div>

        <div class="footer">
            NutriSave © 2026
        </div>

    </div>

</div>

</body>
</html>
