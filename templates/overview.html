<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Overview</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f5f5f5;
}

.header{
    background:#1b5e20;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    text-align:center;
    margin-top:30px;
}

.card{
    display:inline-block;
    width:200px;
    background:white;
    margin:10px;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px #ccc;
}

.back{
    display:inline-block;
    margin:10px;
    padding:8px 12px;
    background:#1b5e20;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>

</head>

<body style="background-color:green;">

<div class="header">
    <h2>📊 Dashboard Overview</h2>
</div>

<a href="/restaurant_dashboard" class="back">⬅ Back</a>

<div class="container">

    <div class="card">
        <h3>Total Food</h3>
        <p>{{ total_food }}</p>
    </div>

    <div class="card">
        <h3>Total Donations</h3>
        <p>{{ total_requests }}</p>
    </div>

    <div class="card">
        <h3>Accepted</h3>
        <p>{{ accepted }}</p>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <p>{{ pending }}</p>
    </div>

</div>

</body>
</html>
